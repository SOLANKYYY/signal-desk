[project]
name = "signal-desk"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "pymongo==4.18.2",
  "dnspython==2.8.0",
  "pypdf==6.10.0",
  "Flask==3.1.3",
  "vercel-queue==0.9.0",
]
[tool.vercel]
entrypoint = "app:app"
[[tool.vercel.subscribers]]
entrypoint = "worker"

[tool.uv]
package = false
