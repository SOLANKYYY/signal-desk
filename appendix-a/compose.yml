name: signal-desk-final
services:
  mongo:
    image: mongo:8.0
    command: [mongod, --bind_ip_all, --wiredTigerCacheSizeGB, '0.4']
    volumes: [chat-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 30
  ollama:
    image: ollama/ollama:0.6.8
    volumes: [chat-models:/root/.ollama]
  app:
    build:
      context: ..
      dockerfile: appendix-a/Dockerfile
    ports: ['127.0.0.1:8019:8000']
    environment:
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Run START.ps1 to create local credentials}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: signal_desk_final
      LLM_BACKEND: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIMENSIONS: '768'
      CHAT_RETRIEVAL: exact
    depends_on:
      mongo: {condition: service_healthy}
      ollama: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=4)']
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  chat-data:
  chat-models:
